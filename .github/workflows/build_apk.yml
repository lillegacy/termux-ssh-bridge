name: Build Termux SSH Bridge APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Restore stable release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Refusing to build a throwaway-signed APK that could not update an installed app."
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=keystore/release.jks"
          } > android/key.properties
          echo "Stable release keystore restored."

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (ARM64)
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "Building Termux SSH Bridge ${VERSION}"
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=APP_VERSION="${VERSION}"

      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          EXPECTED="D5:42:FD:9D:C3:FF:B9:31:89:1E:65:FC:7A:E9:67:BF:62:63:9D:83:8B:00:BB:E1:13:7B:1C:BF:9C:BB:E2:43"
          CERT=$(keytool -printcert -jarfile "$APK")
          echo "$CERT" | grep -E "Owner:|Issuer:" || true
          ACTUAL=$(echo "$CERT" | grep "SHA256:" | tr -d " " | cut -d: -f2-)
          echo "Actual   SHA256: $ACTUAL"
          echo "Expected SHA256: $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signed with an unexpected certificate ($ACTUAL). Installed apps could not update in place."
            exit 1
          fi
          echo "OK: APK signed with the stable release key."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-ssh-bridge-arm64
          path: build/app/outputs/flutter-apk/app-release.apk

  github-release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: termux-ssh-bridge-arm64
          path: apk

      - name: Rename APK Release Asset
        run: mv apk/app-release.apk "termux-ssh-bridge-${{ github.ref_name }}-arm64.apk"

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: termux-ssh-bridge-${{ github.ref_name }}-arm64.apk
          generate_release_notes: true
          draft: false
          prerelease: false
